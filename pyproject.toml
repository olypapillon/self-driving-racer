[project]
name = "self-driving-racer"
version = "0.1.0"
description = "A pseudo-3D racer where self-driving algorithms race one lap"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
